name: 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 패키지 설치와 웹 파일 만들기
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 앱 아이콘 넣기
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: 웹 파일을 안드로이드로 복사
        run: npx cap sync android

      - name: 항상 같은 서명 키 쓰기 (업데이트 설치가 되도록)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../uri-eonje-mannal.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: uri-eonje-mannal-apk
          path: uri-eonje-mannal.apk

      - name: 다운로드 페이지(Releases)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest uri-eonje-mannal.apk \
            --title "우리 언제 만나 (최신)" \
            --notes "안드로이드 폰에서 uri-eonje-mannal.apk 를 눌러 받은 뒤 설치하세요. 아이폰은 ${{ env.WEB_URL }} 을 Safari로 열고 '홈 화면에 추가' 하세요." \
            --target ${{ github.sha }}

  web:
    name: 아이폰·웹 버전
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 웹 파일 만들기
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deploy
        uses: actions/deploy-pages@v4
