<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 언제 만나</title>
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="언제만나">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-width column; home lists 모임, each 모임 opens its own month calendar */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202e; --muted:#5d6878; --line:#dde2ea;
  --accent:#2f5bd3; --accent-ink:#ffffff;
  --yes:#1f9d6b; --yes-soft:#d6f2e5; --maybe:#c98a0c; --maybe-soft:#fbedcc;
  --sun:#d0433a; --sat:#2f5bd3; --ev:#7c3fc9; --ev-soft:#ece2fa;
  --heat:47,91,211;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --fg:#e8ecf3; --muted:#98a3b4; --line:#2a3242;
  --accent:#7d9cff; --accent-ink:#0d1220;
  --yes:#46c991; --yes-soft:#16382b; --maybe:#e8b247; --maybe-soft:#3a2f14;
  --sun:#f07b72; --sat:#8eaaff; --ev:#c4a0ff; --ev-soft:#2e2443; --heat:125,156,255; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --fg:#e8ecf3; --muted:#98a3b4; --line:#2a3242;
  --accent:#7d9cff; --accent-ink:#0d1220;
  --yes:#46c991; --yes-soft:#16382b; --maybe:#e8b247; --maybe-soft:#3a2f14;
  --sun:#f07b72; --sat:#8eaaff; --ev:#c4a0ff; --ev-soft:#2e2443; --heat:125,156,255; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.glist{display:flex;flex-direction:column}
.gitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);background:none;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:500}
.gitem:last-child{border-bottom:0}
.gitem small{color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.18em;font-weight:600;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;user-select:all}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head h2{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
.cell{min-height:74px;min-width:0;max-width:100%;padding:4px 2px 5px;border-radius:10px;border:1px solid transparent;background:var(--bg);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.cell .n{text-align:center;font-size:14px;line-height:1.2}
.names{display:flex;flex-direction:column;gap:1px;min-width:0}
.nm{display:flex;align-items:center;gap:2px;font-size:10px;line-height:1.25;font-weight:600;min-width:0;color:var(--fg)}
.nm i{flex:none;width:6px;height:6px;border-radius:50%}
.me-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;font-size:13px;flex:none;margin-top:2px}
.nm span{overflow:hidden;white-space:nowrap;min-width:0}
.nm.mb{color:var(--maybe);font-weight:500}
.nm.more{color:var(--muted);justify-content:center}
@media (min-width:440px){.nm{font-size:11px}.cell{min-height:84px}}
.cell.sun .n{color:var(--sun)} .cell.sat .n{color:var(--sat)}
.cell.blank{visibility:hidden}
.cell.past{opacity:.35;cursor:default}
.cell.today{border-color:var(--fg)}
.cell.yes{background:var(--yes-soft);border-color:var(--yes)}
.cell.yes .tag{color:var(--yes)}
.cell.maybe{background:var(--maybe-soft);border-color:var(--maybe)}
.cell.maybe .tag{color:var(--maybe)}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.tag{font-size:10.5px;font-weight:600;line-height:1}
.cnt{font-size:11px;font-weight:600;color:var(--muted)}
.cell.all .cnt{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid}
.best{display:flex;flex-direction:column;gap:6px}
.bitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--bg);text-align:left;font-weight:500;border:1px solid transparent}
.bitem .d{font-variant-numeric:tabular-nums;font-weight:600;min-width:84px}
.bitem .who{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:12.5px;font-weight:700;color:var(--yes);font-variant-numeric:tabular-nums}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--yes);color:var(--surface);font-weight:700}
.detail{font-size:14px;display:flex;flex-direction:column;gap:6px}
.detail .ln{display:flex;gap:8px;align-items:baseline}
.detail b{min-width:44px;font-size:12.5px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.warn{color:var(--sun)}
.status{font-size:12px;color:var(--muted);text-align:right;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.evs{display:flex;flex-direction:column;gap:1px;min-width:0}
.ev{font-size:10px;line-height:1.35;font-weight:600;color:var(--ev);background:var(--ev-soft);border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden}
.ev.more{background:transparent;padding:0;text-align:center;color:var(--muted)}
.sheet-back{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{min-width:0}
input[type=date]{min-height:44px}
.evtitle{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evtitle small{color:var(--muted);font-weight:400}
.bitem .d.ev-d{color:var(--ev)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.cell{transition:background .12s,border-color .12s}}

html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html.native{padding-top:max(env(safe-area-inset-top,0px),28px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>우리 언제 만나</h1>
    <p class="sub">모임마다 달력을 하나씩. 각자 되는 날만 콕콕 찍으면 겹치는 날이 보여요.</p>
  </header>
  <div class="panel"><p class="empty" id="boot">불러오는 중…</p></div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="sheetRoot"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
